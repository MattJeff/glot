# glot dogfooding: this dashboard is translated by glot itself.
source_locale = "en"
# The site routes en, fr, es, de, ja, ar today; the others are kept ready in the cloud project "lot".
target_locales = ["fr", "es", "de", "ja", "ar", "pt-BR", "it", "zh-CN", "ko", "nl", "ru", "fi", "cs", "uk", "he", "da", "vi", "sv", "hi", "pl", "id", "th", "tr", "en-GB", "es-MX", "pt-PT", "zh-TW", "el", "hu", "ro", "nb"]
files = ["messages/{locale}.json"]
format = "json-nested"
syntax = "icu"

[llm]
provider = "anthropic"
model = "claude-haiku-5-5"
fallback_model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
budget_usd = 2.0
style = "Concise developer-tool UI copy. Neutral, precise, no marketing fluff in the app screens. French: vouvoiement."

[qa]
score_threshold = 80
max_length_ratio = 1.6

[extract]
include = ["app/**/*.{ts,tsx}", "components/**/*.{ts,tsx}", "lib/**/*.{ts,tsx}"]
# Docs content (web/content/docs/*.md) is English documentation, not UI: never extracted.
exclude = ["**/node_modules/**", "**/*.test.*", "**/*.spec.*", "content/**"]

# glot cloud project that hosts this dashboard's own catalogs (glot in glot).
# Token: a personal API token from app.glotlang.com/app/settings/tokens, in GLOT_TOKEN (never committed).
[server]
url = "https://app.glotlang.com"
project = "lot"
token_env = "GLOT_TOKEN"
