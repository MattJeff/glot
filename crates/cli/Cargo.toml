[package]
name = "glot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "glot"
path = "src/main.rs"

[dependencies]
glot-core.workspace = true
glot-llm.workspace = true
glot-extract.workspace = true
glot-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
clap = { version = "4", features = ["derive"] }
anstream = "1"
anstyle = "1"
# glot db (database content → glot_translations)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
toml.workspace = true
# glot dev (overlay server)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.9"
futures = "0.3"
# glot i18nize setup (AST edits of next.config, layouts, module configs)
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_ast_visit = "0.154"
oxc_parser = "0.154"
oxc_span = "0.154"
oxc_syntax = "0.154"
# glot assets (SVG / OG images -> PNG); same rustybuzz/ttf-parser as glot-core
log = "0.4"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# glot queue import (XLIFF)
roxmltree = "0.20"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
