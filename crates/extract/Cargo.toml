[package]
name = "glot-extract"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glot-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
glob.workspace = true
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_ast_visit = "0.154"
oxc_parser = "0.154"
oxc_span = "0.154"
oxc_syntax = "0.154"
# Rust `view!` bodies: token trees with byte spans, expressions parsed like rustc reads them.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
