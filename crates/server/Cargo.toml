[package]
name = "glot-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toml.workspace = true
glot-core.workspace = true
glot-extract.workspace = true
glot-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sha2.workspace = true
glob.workspace = true
reqwest.workspace = true
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros", "derive"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tokio-stream = { version = "0.1", features = ["sync"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.9"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
base64 = "0.23"
hmac = "0.12"
roxmltree = "0.20"
ring = "0.17"
lol_html = "3"
regex = "1"
whatlang = "0.18"
# render-protocol: CLDR number and date formatting of typed variables (same ICU4X train as glot-core).
icu_decimal = "~2.3"
icu_datetime = "~2.3"
icu_locale_core = "2.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
