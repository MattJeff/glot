name: glot
description: Validate and translate i18n catalogs with glot, commit the result and comment on the pull request.
branding:
  icon: globe
  color: blue

inputs:
  version:
    description: >-
      glot release tag (e.g. v0.3.0). Default: the version pinned in this action's VERSION file, so
      `@v0` always installs the binary it was released with. "latest" only when you ask for it.
      Skipped when `glot` is already on PATH.
    default: ""
  working-directory:
    description: Directory containing glot.toml.
    default: .
  command:
    description: "check | translate | both"
    default: check
  comment:
    description: Post (or update) a summary comment on the pull request.
    default: "true"
  anthropic-api-key:
    description: Exported as ANTHROPIC_API_KEY for `glot translate`.
    default: ""
  openai-api-key:
    description: Exported as OPENAI_API_KEY (provider openai / openai-compatible).
    default: ""
  llm-api-key:
    description: Generic LLM key, exported under glot.toml's `llm.api_key_env` (else the provider's default variable).
    default: ""
  anthropic-workspace-id:
    description: Exported as ANTHROPIC_WORKSPACE_ID (org-level user keys sk-ant-usr-… must name the workspace to bill).
    default: ""
  fail-on-error:
    description: Fail the job when `glot check` reports errors.
    default: "true"
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}
  token:
    description: >-
      Token used to push the translation commit (PAT or GitHub App token). Empty: push with the
      checkout credentials (GITHUB_TOKEN), whose pushes do not trigger new workflow runs.
    default: ""

outputs:
  check-exit-code:
    description: Exit code of `glot check`.
    value: ${{ steps.check.outputs.code }}

runs:
  using: composite
  steps:
    - name: Install glot
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPO: ${{ github.action_repository || github.repository }}
      run: |
        set -euo pipefail
        if command -v glot >/dev/null; then echo "Using $(command -v glot) ($(glot --version))"; exit 0; fi
        [ -n "$VERSION" ] || VERSION=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/VERSION")
        if [ "$VERSION" = latest ]; then
          VERSION=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$REPO/releases/latest" | sed 's|.*/tag/||')
        fi
        case "$VERSION" in v*) ;; *) echo "::error::Invalid glot version '$VERSION'"; exit 1 ;; esac
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)     target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64)   target=aarch64-unknown-linux-gnu ;;
          macOS-ARM64)   target=aarch64-apple-darwin ;;
          macOS-X64)     target=x86_64-apple-darwin ;;
          Windows-X64)   target=x86_64-pc-windows-msvc ;;
          *)
            echo "::notice::No prebuilt glot for ${RUNNER_OS}-${RUNNER_ARCH}, building $VERSION from source"
            cargo install --locked --git "https://github.com/$REPO" --tag "$VERSION" glot-cli
            exit 0 ;;
        esac
        ext=tar.gz; [ "$RUNNER_OS" = Windows ] && ext=zip
        asset="glot-$target.$ext"
        base="https://github.com/$REPO/releases/download/$VERSION"
        dl="$RUNNER_TEMP/glot-dl"; bin="$RUNNER_TEMP/glot-bin"; mkdir -p "$dl" "$bin"
        curl -fsSL "$base/$asset" -o "$dl/$asset" || { echo "::error::Download failed: $base/$asset"; exit 1; }
        curl -fsSL "$base/SHA256SUMS" -o "$dl/SHA256SUMS" || { echo "::error::No SHA256SUMS in release $VERSION; refusing to install"; exit 1; }
        expected=$(awk -v f="$asset" '$2 == f || $2 == "*"f { print $1 }' "$dl/SHA256SUMS")
        if command -v sha256sum >/dev/null; then actual=$(sha256sum "$dl/$asset" | cut -d' ' -f1); else actual=$(shasum -a 256 "$dl/$asset" | cut -d' ' -f1); fi
        if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
          echo "::error::Checksum mismatch for $asset (expected '${expected:-none}', got $actual)"; exit 1
        fi
        if [ "$ext" = zip ]; then unzip -oq "$dl/$asset" -d "$bin"; else tar -xzf "$dl/$asset" -C "$bin"; fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "Installed $("$bin/glot" --version) (sha256 verified)"

    - name: Translate
      id: translate
      if: inputs.command == 'translate' || inputs.command == 'both'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        IN_OPENAI_KEY: ${{ inputs.openai-api-key }}
        IN_LLM_KEY: ${{ inputs.llm-api-key }}
        IN_WORKSPACE: ${{ inputs.anthropic-workspace-id }}
        NO_COLOR: "1"
      run: |
        set -euo pipefail
        # Empty inputs keep whatever the job env already sets.
        if [ -n "$IN_ANTHROPIC_KEY" ]; then export ANTHROPIC_API_KEY="$IN_ANTHROPIC_KEY"; fi
        if [ -n "$IN_OPENAI_KEY" ]; then export OPENAI_API_KEY="$IN_OPENAI_KEY"; fi
        if [ -n "$IN_WORKSPACE" ]; then export ANTHROPIC_WORKSPACE_ID="$IN_WORKSPACE"; fi
        if [ -n "$IN_LLM_KEY" ]; then
          py=$(command -v python3 || command -v python)
          var=$("$py" -c 'import tomllib; l = tomllib.load(open("glot.toml", "rb")).get("llm", {}); print(l.get("api_key_env") or ("OPENAI_API_KEY" if l.get("provider", "").startswith("openai") else "ANTHROPIC_API_KEY"))')
          export "$var=$IN_LLM_KEY"
        fi
        glot translate --yes | tee "$RUNNER_TEMP/glot-translate.log"
        cost=$(sed -n 's/^Cost: \$\([0-9.]*\).*/\1/p' "$RUNNER_TEMP/glot-translate.log" | tail -1)
        echo "cost=${cost:-0}" >> "$GITHUB_OUTPUT"

    - name: Commit translations
      if: steps.translate.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUSH_TOKEN: ${{ inputs.token }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        # Stage only what glot writes: catalogs (glot.toml `files`, {locale} -> *), the lock and pixel budgets.
        py=$(command -v python3 || command -v python)
        specs=(); paths=()
        while IFS= read -r f; do specs+=("$f"); done < <("$py" -c 'import tomllib; [print(":(glob)" + f.replace("{locale}", "*")) for f in tomllib.load(open("glot.toml", "rb"))["files"]]')
        while IFS= read -r -d '' f; do paths+=("$f"); done < <(git ls-files -z -m -o --exclude-standard -- "${specs[@]}" glot.lock .glot/layout.json)
        if [ ${#paths[@]} -gt 0 ]; then git add -A -- "${paths[@]}"; fi
        if git diff --cached --quiet; then echo "No translation changes"; exit 0; fi
        if [ -z "$HEAD_REF" ] || ! git symbolic-ref -q HEAD >/dev/null; then
          # ponytail: pushing the synthetic PR merge commit would pollute the branch; require a branch checkout.
          echo "::warning::Not on a branch (checkout with ref: \${{ github.head_ref }}); skipping commit"
          git reset -q; exit 0
        fi
        git config user.name "glot[bot]"
        git config user.email "glot-bot@users.noreply.github.com"
        git commit -qm "i18n: glot translate"
        auth=()
        if [ -n "$PUSH_TOKEN" ]; then
          # Replace the checkout's GITHUB_TOKEN header so the push runs as the PAT / App (and triggers CI).
          b64=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$b64"
          key="http.$GITHUB_SERVER_URL/.extraheader"
          auth=(-c "$key=" -c "$key=AUTHORIZATION: basic $b64")
        fi
        git ${auth[@]+"${auth[@]}"} push origin "HEAD:refs/heads/$HEAD_REF"

    - name: Check
      id: check
      if: always() && inputs.command != 'translate'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NO_COLOR: "1"
      run: |
        set +e
        glot check --format github
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: always() && inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        COST: ${{ steps.translate.outputs.cost }}
        CHECK_CODE: ${{ steps.check.outputs.code }}
        NO_COLOR: "1"
      run: |
        set -euo pipefail
        marker='<!-- glot-report -->'
        status=$(glot status --json)
        findings=$(glot check --format json || true)
        {
          echo "$marker"
          echo "## 🌐 glot"
          echo
          echo "| Locale | Translated | Missing | Stale | Reviewed | Errors | Warnings |"
          echo "|---|---:|---:|---:|---:|---:|---:|"
          jq -r '.locales | to_entries[] | "| `\(.key)` | \(.value.translated)/\(.value.total) | \(.value.missing) | \(.value.stale) | \(.value.reviewed) | \(.value.errors) | \(.value.warnings) |"' <<<"$status"
          echo
          n=$(jq length <<<"$findings")
          if [ "$n" -gt 0 ]; then
            echo "<details><summary><b>$n issue(s)</b></summary>"
            echo
            echo "| | Locale | Key | Issue |"
            echo "|---|---|---|---|"
            jq -r '.[:50][] | "| \(if .issue.severity == "error" then "❌" else "⚠️" end) | `\(.locale)` | `\(.key)` | \(.issue.message | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"' <<<"$findings"
            if [ "$n" -gt 50 ]; then echo "| | | | …and $((n - 50)) more |"; fi
            echo
            echo "</details>"
          else
            echo "✅ No issues."
          fi
          if [ -n "$COST" ]; then echo; echo "Translation cost: **\$$COST**"; fi
        } > "$RUNNER_TEMP/glot-comment.md"
        cat "$RUNNER_TEMP/glot-comment.md" >> "$GITHUB_STEP_SUMMARY"
        repo="$GITHUB_REPOSITORY"
        id=$(gh api "repos/$repo/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1) || id=
        # Fork PRs get a read-only token: keep the report in the job summary instead of failing.
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$id" -F "body=@$RUNNER_TEMP/glot-comment.md" >/dev/null
        else
          gh pr comment "$PR" --repo "$repo" --body-file "$RUNNER_TEMP/glot-comment.md"
        fi || echo "::warning::Could not post the PR comment (read-only token?); report is in the job summary"

    - name: Fail on check errors
      if: always() && inputs.fail-on-error == 'true' && steps.check.outputs.code != '' && steps.check.outputs.code != '0'
      shell: bash
      run: |
        echo "::error::glot check reported errors"
        exit 1
