# glot production stack: one VPS, Caddy in front. See web/content/docs/deploy-hetzner.md.
#   cd deploy && docker compose -f compose.prod.yml up -d --build --wait
# Variables come from deploy/.env (compose reads it from the compose file's directory).
name: glot

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: glot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: glot
    # ponytail: two knobs sized for a 4 GB box; pgtune when the DB outgrows it.
    command: postgres -c shared_buffers=256MB -c max_connections=50
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glot -d glot"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    logging: *logging

  server:
    image: glot-server:latest
    build:
      context: ..
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://glot:${POSTGRES_PASSWORD}@postgres:5432/glot
      GLOT_BIND: 0.0.0.0:8790
      GLOT_SECRET_KEY: ${GLOT_SECRET_KEY:?set GLOT_SECRET_KEY in deploy/.env}
      # https:// origin => session cookie gets `Secure` (SameSite=Lax, host-only on app.<domain>).
      GLOT_WEB_ORIGIN: https://app.${GLOT_DOMAIN:?set GLOT_DOMAIN}${GLOT_PORT_SUFFIX:-}
      GLOT_PUBLIC_URL: https://api.${GLOT_DOMAIN}${GLOT_PORT_SUFFIX:-}
      GLOT_MCP_ALLOWED_ORIGINS: ${GLOT_MCP_ALLOWED_ORIGINS:-}
      GLOT_MCP_RATE_PER_MIN: ${GLOT_MCP_RATE_PER_MIN:-120}
      GLOT_INSIGHTS_RATE_PER_MIN: ${GLOT_INSIGHTS_RATE_PER_MIN:-1200}
      GLOT_FEEDBACK_RATE_PER_MIN: ${GLOT_FEEDBACK_RATE_PER_MIN:-30}
      # Transactional email (Resend HTTP API); empty key = email disabled.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-glot <noreply@mail.${GLOT_DOMAIN}>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      GLOT_EMAIL_RATE_PER_HOUR: ${GLOT_EMAIL_RATE_PER_HOUR:-10}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      STRIPE_METER_EVENT: ${STRIPE_METER_EVENT:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-0}
      GLOT_BILLING_GRACE_DAYS: ${GLOT_BILLING_GRACE_DAYS:-7}
      GLOT_PLAN_LIMITS: ${GLOT_PLAN_LIMITS:-}
      RUST_LOG: ${RUST_LOG:-glot_server=info,tower_http=info}
      GLOT_LOG_FORMAT: json
      GLOT_ADMIN_EMAILS: ${GLOT_ADMIN_EMAILS:-}
      # One-click connect of the CMS connectors (empty = manual credentials form for that platform).
      GLOT_SHOPIFY_CLIENT_ID: ${GLOT_SHOPIFY_CLIENT_ID:-}
      GLOT_SHOPIFY_CLIENT_SECRET: ${GLOT_SHOPIFY_CLIENT_SECRET:-}
      GLOT_WEBFLOW_CLIENT_ID: ${GLOT_WEBFLOW_CLIENT_ID:-}
      GLOT_WEBFLOW_CLIENT_SECRET: ${GLOT_WEBFLOW_CLIENT_SECRET:-}
      GLOT_HUBSPOT_CLIENT_ID: ${GLOT_HUBSPOT_CLIENT_ID:-}
      GLOT_HUBSPOT_CLIENT_SECRET: ${GLOT_HUBSPOT_CLIENT_SECRET:-}
      # Local SEO: Google Search Console (OAuth web client; redirect https://api.<domain>/api/local-seo/gsc/callback).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GLOT_RENDERER_URL: http://renderer:8795
      GLOT_RENDERER_TOKEN: ${GLOT_RENDERER_TOKEN:-}
      # glot Edge proxy: last known domains/TMs on disk (served if Postgres is down, survives restarts).
      GLOT_EDGE_CACHE_DIR: /var/cache/glot-edge
      # glot Edge: DNS verification target, and Caddy's fallback map (server down → Caddy serves the origin).
      GLOT_EDGE_CNAME: edge.${GLOT_DOMAIN}
      GLOT_CADDY_MAP: /etc/caddy/edge/origins.caddy
      GLOT_CADDY_ADMIN: http://caddy-admin:2019
      GLOT_CADDYFILE: /etc/glot/Caddyfile
    volumes:
      - edge_cache:/var/cache/glot-edge
      - caddy_edge:/etc/caddy/edge
      - ./Caddyfile:/etc/glot/Caddyfile:ro
    networks: [default, render, caddy_admin]
    depends_on:
      postgres: { condition: service_healthy }
    # The image has no curl: bash /dev/tcp is enough for a liveness probe.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8790 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 896m
    logging: *logging

  web:
    image: glot-web:latest
    build:
      context: ../web
      args:
        GLOT_API_URL: http://server:8790  # baked into Next rewrites (/api, /cdn -> server)
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  # glot Edge snapshots of SPA pages (packages/renderer). Own network: reaches the internet and the server, never Postgres.
  # Sized for the 1.9 GB VPS: one chromium-headless-shell, one page at a time, started on demand and stopped after
  # 60 s idle (~90 MB then), recycled every 50 renders or past 320 MB. Measured peak 298 MB (docker stats) rendering
  # Vite React, Next export and a Leptos/WASM app (docs edge.md, "100 % JavaScript apps").
  # Alternative without any browser here: `glot prerender --upload` in the CI (POST /edge/v1/{project}/snapshots).
  renderer:
    # Opt-in: `docker compose --profile renderer up -d` (+ GLOT_RENDERER_TOKEN in deploy/.env). Without it, Edge serves
    # SPA origins as-is or the snapshots imported from the CI.
    profiles: [renderer]
    image: glot-renderer:latest
    build:
      context: ..
      dockerfile: packages/renderer/Dockerfile
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${GLOT_RENDERER_TOKEN:-}
      RENDERER_TTL_S: ${GLOT_RENDERER_TTL_S:-86400}
      RENDERER_IDLE_S: ${GLOT_RENDERER_IDLE_S:-60}
      RENDERER_RECYCLE_AFTER: ${GLOT_RENDERER_RECYCLE_AFTER:-50}
      RENDERER_RECYCLE_MB: ${GLOT_RENDERER_RECYCLE_MB:-320}
      RENDERER_TIMEOUT_MS: ${GLOT_RENDERER_TIMEOUT_MS:-15000}
      RENDERER_MAX_QUEUE: ${GLOT_RENDERER_MAX_QUEUE:-100}
    volumes:
      - renderer:/data
    networks: [render]
    init: true  # reaps Chromium's zombie processes (--disable-dev-shm-usage: no /dev/shm or ipc: host needed)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8795/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 450m
    memswap_limit: 450m
    cpus: 1.0
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${GLOT_HTTP_PORT:-80}:80"
      - "${GLOT_HTTPS_PORT:-443}:443"
      - "${GLOT_HTTPS_PORT:-443}:443/udp"  # HTTP/3
    environment:
      GLOT_DOMAIN: ${GLOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates: keep it, or Let's Encrypt rate limits bite
      - caddy_config:/config
      - caddy_edge:/etc/caddy/edge:ro  # glot Edge fallback map, written by the server
    networks:
      default:
      caddy_admin:
        aliases: [caddy-admin]  # the admin API binds to this network only (Caddyfile `admin caddy-admin:2019`)
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://caddy-admin:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    logging: *logging

networks:
  default:
  render:
  # Caddy admin API ↔ glot-server only.
  caddy_admin:
    internal: true

volumes:
  pg:
  renderer:
  edge_cache:
  caddy_data:
  caddy_config:
  caddy_edge:
