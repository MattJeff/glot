name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p glot-cli -p glot-server
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir=target/${{ matrix.target }}/release
          name=glot-${{ matrix.target }}
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "./$dir/glot.exe" "./$dir/glot-server.exe" README.md LICENSE
          else
            tar -czf "$name.tar.gz" -C "$dir" glot glot-server -C "$GITHUB_WORKSPACE" README.md LICENSE
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: glot-${{ matrix.target }}.*
